<!doctype html>
<html lang="vi">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Triển khai & Quản trị Hệ thống - Bài 6</title>
    <style>
      :root {
        --bg1: #89f7fe;
        --bg2: #66a6ff;
        --card: #ffffff;
        --ink: #1f2937;
        --muted: #6b7280;
        --accent: #2563eb;
        --good: #16a34a;
        --bad: #dc2626;
      }
      body {
        margin: 0;
        font-family: Inter, system-ui, sans-serif;
        color: var(--ink);
        background: linear-gradient(135deg, var(--bg1), var(--bg2));
        min-height: 100vh;
        display: flex;
        flex-direction: column;
      }
      header {
        position: sticky;
        top: 0;
        z-index: 5;
        background: rgba(255, 255, 255, 0.6);
        backdrop-filter: blur(6px);
        border-bottom: 1px solid rgba(0, 0, 0, 0.06);
      }
      .wrap {
        max-width: 900px;
        margin: 0 auto;
        padding: 16px 20px;
      }
      h1 {
        margin: 0 0 8px;
        font-size: clamp(22px, 3vw, 30px);
      }
      .toolbar {
        display: flex;
        gap: 10px;
        flex-wrap: wrap;
        align-items: center;
      }
      button {
        border: none;
        padding: 10px 16px;
        border-radius: 12px;
        cursor: pointer;
        font-weight: 600;
        background: var(--accent);
        color: #fff;
      }
      button.secondary {
        background: #111827;
      }
      button.ghost {
        background: #fff;
        color: #111827;
        border: 1px solid #ddd;
      }
      .cards {
        display: flex;
        flex-direction: column;
        gap: 16px;
        padding: 20px;
      }
      .card {
        background: var(--card);
        border-radius: 18px;
        padding: 18px;
        box-shadow: 0 10px 30px rgba(0, 0, 0, 0.08);
      }
      .qhead {
        display: flex;
        gap: 10px;
        align-items: flex-start;
      }
      .qidx {
        width: 36px;
        height: 36px;
        border-radius: 10px;
        display: grid;
        place-items: center;
        font-weight: 700;
        color: #fff;
        background: #111827;
        flex-shrink: 0;
      }
      .qtitle {
        font-weight: 700;
      }
      .hint {
        font-size: 13px;
        color: var(--muted);
        margin-top: 4px;
      }
      .answers {
        margin-top: 12px;
        display: flex;
        flex-direction: column;
        gap: 8px;
      }
      .answers label {
        display: flex;
        gap: 10px;
        align-items: center;
        padding: 10px 12px;
        border: 1px solid #ddd;
        border-radius: 12px;
        cursor: pointer;
        background: #fff;
      }
      .answers input {
        width: 18px;
        height: 18px;
      }
      .tf-item {
        padding: 10px 12px;
        border: 1px solid #ddd;
        border-radius: 12px;
        background: #fff;
        margin-bottom: 8px;
      }
      .tf-row {
        margin-top: 6px;
        display: flex;
        gap: 16px;
      }
      .dragwrap {
        display: grid;
        gap: 12px;
      }
      .dragzone {
        display: grid;
        grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
        gap: 12px;
      }
      .zone {
        min-height: 64px;
        border: 2px dashed #aaa;
        border-radius: 14px;
        padding: 10px;
        background: #fafafa;
      }
      .pill {
        background: #eef2ff;
        border: 1px solid #99c;
        border-radius: 999px;
        padding: 8px 12px;
        display: inline-flex;
        gap: 8px;
        align-items: center;
        font-weight: 600;
        user-select: none;
        cursor: grab;
        margin: 4px;
      }
      .pool,
      .droparea {
        display: flex;
        flex-wrap: wrap;
        gap: 8px;
        min-height: 40px;
      }
      .result {
        margin-top: 12px;
        font-weight: 700;
      }
      .r-good {
        color: var(--good);
      }
      .r-bad {
        color: var(--bad);
      }
    </style>
  </head>
  <body>
    <header>
      <div class="wrap">
        <h1>Triển khai & Quản trị Hệ thống - Bài 6</h1>
        <div class="toolbar">
          <button id="btnCheck">Xem kết quả</button>
          <button class="secondary" id="btnReset">Làm lại & đảo câu</button>
          <button class="ghost" id="btnToggleKey">Hiện/ẩn đáp án đúng</button>
          <div class="meta" id="meta">0/0 câu</div>
        </div>
      </div>
    </header>

    <main class="wrap"><div id="list" class="cards"></div></main>
    <script>
      const clone = (x) => JSON.parse(JSON.stringify(x));
      const shuffle = (arr) => {
        const a = [...arr];
        for (let i = a.length - 1; i > 0; i--) {
          const j = Math.floor(Math.random() * (i + 1));
          [a[i], a[j]] = [a[j], a[i]];
        }
        return a;
      };
      const el = (tag, attrs = {}, html = "") => {
        const e = document.createElement(tag);
        Object.entries(attrs).forEach(([k, v]) => {
          if (k === "class") e.className = v;
          else if (k === "dataset") Object.assign(e.dataset, v);
          else e.setAttribute(k, v);
        });
        if (html) e.innerHTML = html;
        return e;
      };
      const safeId = (str) =>
        "id_" +
        str
          .normalize("NFD")
          .replace(/[\u0300-\u036f]/g, "")
          .replace(/[^a-zA-Z0-9]/g, "_");

      const BANK = [
        {
          id: 1,
          type: "multi",
          title: "Tại sao cần thực hiện giai đoạn “Thu hồi tài khoản” (Offboarding) ngay khi nhân viên nghỉ việc? Hãy chọn 2 đáp án đúng nhất !",
          options: [
            "Để ngăn chặn nhân viên cũ tiếp tục truy cập vào hệ thống và dữ liệu nhạy cảm",
            "Tránh để lại “tài khoản ma” có thể bị lợi dụng gây rủi ro bảo mật",
            "Để tự động xóa toàn bộ dữ liệu liên quan",
            "Vì tài khoản sẽ tự hết hạn sau 30 ngày",
          ],
          answer: [
            "Để ngăn chặn nhân viên cũ tiếp tục truy cập vào hệ thống và dữ liệu nhạy cảm",
            "Tránh để lại “tài khoản ma” có thể bị lợi dụng gây rủi ro bảo mật",
          ],
        },
        {
          id: 2,
          type: "single",
          title: "Trong MySQL, danh tính tài khoản người dùng được xác định bởi sự kết hợp nào?",
          options: [
            "Username và mật khẩu",
            "Username và Host (địa chỉ kết nối)",
            "Username và Role",
            "Username và Schema",
          ],
          answer: ["Username và Host (địa chỉ kết nối)"],
        },
        {
          id: 3,
          type: "multi",
          title: "Plugin xác thực nào được sử dụng trong MySQL phiên bản 8.0 và cũ hơn? Hãy chọn 2 đáp án đúng nhất !",
          options: [
            "mysql_native_password",
            "caching_sha2_password",
            "md5",
            "scram-sha-256",
          ],
          answer: [
            "mysql_native_password",
            "caching_sha2_password",
          ],
        },
        {
          id: 4,
          type: "single",
          title: "Mục đích của lệnh ALTER DEFAULT PRIVILEGES trong PostgreSQL là gì?",
          options: [
            "Cấp quyền cho tất cả user hiện tại",
            "Tự động gán quyền cho các đối tượng được tạo ra trong tương lai",
            "Xóa toàn bộ quyền của một role",
            "Buộc người dùng đổi mật khẩu ngay lập tức",
          ],
          answer: ["Tự động gán quyền cho các đối tượng được tạo ra trong tương lai"],
        },
        {
          id: 5,
          type: "single",
          title: "Một sinh viên cần tạo tài khoản app_web chỉ được phép kết nối từ IP 10.0.0.5 và chỉ có quyền SELECT, INSERT, UPDATE trên database sales_db. Lệnh nào đúng nhất?",
          options: [
            "CREATE USER 'app_web'@'%' IDENTIFIED BY 'pass'; GRANT ALL ON sales_db.* TO 'app_web'@'%'",
            "CREATE USER 'app_web'@'10.0.0.5' IDENTIFIED BY 'pass'; GRANT SELECT, INSERT, UPDATE ON sales_db.* TO 'app_web'@'10.0.0.5';",
            "CREATE USER 'app_web' IDENTIFIED BY 'pass'; GRANT SELECT ON sales_db.* TO 'app_web';",
            "CREATE USER 'app_web'@'10.0.0.5'; GRANT DELETE ON sales_db.* TO 'app_web'@'10.0.0.5';",
          ],
          answer: ["CREATE USER 'app_web'@'10.0.0.5' IDENTIFIED BY 'pass'; GRANT SELECT, INSERT, UPDATE ON sales_db.* TO 'app_web'@'10.0.0.5';"],
        },
        {
          id: 6,
          type: "single",
          title: "Trong PostgreSQL, để cho phép role readonly_role chỉ đọc dữ liệu trên schema public, cần thực hiện các lệnh nào theo đúng thứ tự?",
          options: [
            "GRANT SELECT ON ALL TABLES IN SCHEMA public TO readonly_role;",
            "GRANT USAGE ON SCHEMA public TO readonly_role; GRANT SELECT ON ALL TABLES IN SCHEMA public TO readonly_role;",
            "GRANT CONNECT ON DATABASE myapp TO readonly_role;",
            "GRANT ALL PRIVILEGES ON SCHEMA public TO readonly_role;",
          ],
          answer: ["GRANT USAGE ON SCHEMA public TO readonly_role; GRANT SELECT ON ALL TABLES IN SCHEMA public TO readonly_role;"],
        },
        {
          id: 7,
          type: "single",
          title: "Khi triển khai docker-compose cho MySQL và PostgreSQL, cổng nào được ánh xạ cho phpMyAdmin?",
          options: [
            "3306",
            "5432",
            "8080",
            "8081",
          ],
          answer: ["8080"],
        },
        {
          id: 8,
          type: "single",
          title: "Trong phpMyAdmin, để thiết lập chính sách mật khẩu tối thiểu 12 ký tự, DBA nên chạy lệnh nào để thiết lập?",
          options: [
            "SET GLOBAL validate_password.length = 12;",
            "SET GLOBAL validate_password.policy = LOW;",
            "ALTER USER 'root'@'localhost' PASSWORD EXPIRE 12;",
            "GRANT SELECT ON mysql.* TO 'root'@'localhost';",
          ],
          answer: ["SET GLOBAL validate_password.length = 12;"],
        },
        {
          id: 9,
          type: "single",
          title: "Khi cấu hình pg_hba.conf để sử dụng phương thức xác thực an toàn nhất cho PostgreSQL, dòng nào nên được ưu tiên?",
          options: [
            "host all all 0.0.0.0/0 trust",
            "host all all 0.0.0.0/0 md5",
            "host all all 0.0.0.0/0 scram-sha-256",
            "local all all peer",
          ],
          answer: ["host all all 0.0.0.0/0 scram-sha-256"],
        },
        {
          id: 10,
          type: "single",
          title: "Trong quá trình cấu hình bảo mật cho hệ thống DBMS của công ty, quản trị viên phát hiện rằng: Một nhân viên IT chỉ cần quyền đọc dữ liệu để đối soát nhưng lại được cấp quyền DELETE. Vấn đề này đã vi phạm nguyên tắc bảo mật nào?",
          options: [
            "RBAC",
            "Principle of Least Privilege",
            "Non-repudiation",
            "Default Privileges",
          ],
          answer: ["Principle of Least Privilege"],
        },
        {
          id: 11,
          type: "single",
          title: "Sau khi tạo role readonly_role trong PostgreSQL, để gán role này cho user report_user, lệnh đúng sau đây là chính xác?",
          options: [
            "GRANT readonly_role TO report_user;",
            "GRANT report_user TO readonly_role;",
            "ALTER ROLE report_user ADD readonly_role;",
            "CREATE ROLE report_user IN readonly_role;",
          ],
          answer: ["GRANT readonly_role TO report_user;"],
        },
        {
          id: 12,
          type: "single",
          title: "Khi sử dụng PostgreSQL, quản trị viên muốn tăng tính bảo mật bằng cách mã hóa dữ liệu, để bật extension pgcrypto trong PostgreSQL, DBA chạy lệnh nào trong Query Tool?",
          options: [
            "CREATE EXTENSION IF NOT EXISTS pgcrypto;",
            "GRANT pgcrypto TO app_user;",
            "ALTER DATABASE myapp ADD EXTENSION pgcrypto;",
            "SET pgcrypto = ON;",
          ],
          answer: ["CREATE EXTENSION IF NOT EXISTS pgcrypto;"],
        },
        {
          id: 13,
          type: "tfset",
          title: "Một tài khoản app_user cần được tạo trong MySQL với điều kiện như sau: Chỉ cho phép kết nối từ máy chủ web (IP 192.168.10.50) và chỉ có quyền SELECT, INSERT trên database university_db. Lệnh nào đúng về ràng buộc host và chỉ cấp đúng quyền cần thiết theo nguyên tắc Least Privilege. Hãy đưa ra nhận định của em.",
          statements: [
            {
              text: "CREATE USER 'app_user'@'%' IDENTIFIED BY 'pass123'; GRANT SELECT, INSERT ON university_db.* TO 'app_user'@'%'",
              answer: false,
            },
            {
              text: "CREATE USER 'app_user'@'192.168.10.50' IDENTIFIED BY 'pass123'; GRANT SELECT, INSERT ON university_db.* TO 'app_user'@'192.168.10.50';",
              answer: true,
            },
            {
              text: "CREATE USER 'app_user' IDENTIFIED BY 'pass123'; GRANT ALL ON university_db.* TO 'app_user';",
              answer: false,
            },
            {
              text: "CREATE USER 'app_user'@'192.168.10.50'; GRANT DELETE ON university_db.* TO 'app_user';",
              answer: false,
            },
          ],
        },
        {
          id: 14,
          type: "tfset",
          title: "Trong PostgreSQL, sau khi tạo role readonly_role, để role này tự động có quyền SELECT trên mọi bảng mới được tạo trong schema public. DBA nên dùng lệnh nào để cho phép gán quyền mặc định cho các đối tượng được tạo trong tương lai. Hãy đưa ra nhận định của em.",
          statements: [
            {
              text: "GRANT SELECT ON ALL TABLES IN SCHEMA public TO readonly_role;",
              answer: false,
            },
            {
              text: "ALTER DEFAULT PRIVILEGES IN SCHEMA public GRANT SELECT ON TABLES TO readonly_role;",
              answer: true,
            },
            {
              text: "GRANT USAGE ON SCHEMA public TO readonly_role;",
              answer: false,
            },
            {
              text: "ALTER ROLE readonly_role SET default_transaction_read_only = on;",
              answer: false,
            },
          ],
        },
        {
          id: 15,
          type: "single",
          title: "Sau khi tạo user report_user chỉ có quyền SELECT trong PostgreSQL, để kiểm tra chính sách phân quyền, DBA nên thực hiện bước nào?",
          options: [
            "Cấp thêm quyền INSERT cho report_user",
            "Tạo kết nối mới bằng report_user và thử thực hiện lệnh DROP TABLE",
            "Xóa role report_user ngay lập tức",
            "Chạy lệnh GRANT ALL PRIVILEGES cho report_user",
          ],
          answer: ["Tạo kết nối mới bằng report_user và thử thực hiện lệnh DROP TABLE"],
        },
        {
          id: 16,
          type: "tfset",
          title: "Trong môi trường Docker, sau khi chạy docker compose up -d, để truy cập giao diện quản trị PostgreSQL, chúng ta có thể sử dụng địa chỉ URL nào sau đây? Hãy đưa ra nhận định của em.",
          statements: [
            {
              text: "http://localhost:3306",
              answer: false,
            },
            {
              text: "http://localhost:8081",
              answer: true,
            },
            {
              text: "http://localhost:8080",
              answer: false,
            },
            {
              text: "http://localhost:5432",
              answer: false,
            },
          ],
        },
        {
          id: 17,
          type: "multi",
          title: "Trong PostgreSQL, để cho phép role app_user có quyền kết nối vào database university_db và đọc dữ liệu trên schema public, cần cấp những quyền nào sau đây? Hãy chọn 3 đáp án đúng nhất !",
          options: [
            "GRANT CONNECT ON DATABASE university_db TO app_user;",
            "GRANT USAGE ON SCHEMA public TO app_user;",
            "GRANT SELECT ON ALL TABLES IN SCHEMA public TO app_user;",
            "GRANT ALL PRIVILEGES ON DATABASE university_db TO app_user;",
            "GRANT SELECT ON SCHEMA public TO app_user;",
          ],
          answer: [
            "GRANT CONNECT ON DATABASE university_db TO app_user;",
            "GRANT USAGE ON SCHEMA public TO app_user;",
            "GRANT SELECT ON ALL TABLES IN SCHEMA public TO app_user;",
          ],
        },
        {
          id: 18,
          type: "single",
          title: "Nguyên tắc “Quyền hạn tối thiểu” (PoLP - Principle of Least Privilege) nhằm mục đích gì?",
          options: [
            "Cấp cho người dùng tất cả quyền để tăng hiệu suất làm việc",
            "Chỉ cấp quyền vừa đủ để hoàn thành nhiệm vụ, không hơn không kém",
            "Cho phép người dùng tự cấp quyền cho người khác",
            "Giới hạn số lượng tài khoản trên hệ thống",
          ],
          answer: ["Chỉ cấp quyền vừa đủ để hoàn thành nhiệm vụ, không hơn không kém"],
        },
        {
          id: 19,
          type: "single",
          title: "Trong PostgreSQL, khái niệm “Role” có đặc điểm gì nổi bật?",
          options: [
            "Chỉ dùng để phân biệt người dùng và nhóm",
            "Không phân biệt giữa User và Group; Role có thể chứa Role khác",
            "Chỉ áp dụng cho tài khoản quản trị",
            "Bắt buộc phải gán quyền qua GRANT OPTION",
          ],
          answer: ["Không phân biệt giữa User và Group; Role có thể chứa Role khác"],
        },
        {
          id: 20,
          type: "single",
          title: "Vai trò chính của việc quản lý tài khoản người dùng (User Account Management) trong hệ quản trị cơ sở dữ liệu là gì?",
          options: [
            "Tăng tốc độ truy vấn dữ liệu",
            "Tự động sao lưu dữ liệu hàng ngày",
            "Thiết lập ranh giới bảo mật và kiểm soát tài nguyên truy cập",
            "Tối ưu hóa cấu trúc bảng trong CSDL",
          ],
          answer: ["Thiết lập ranh giới bảo mật và kiểm soát tài nguyên truy cập"],
        },
      ];

      let WORK = [];
      function reset(shuffleAll = true) {
        WORK = clone(BANK);
        if (shuffleAll) WORK = shuffle(WORK);
        WORK.forEach((q) => {
          if (q.options) q.options = shuffle(q.options);
          if (q.type === "drag_pairs") {
            const entries = Object.entries(q.pairs);
            q.__left = shuffle(entries.map(([k]) => k));
            q.__right = shuffle(entries.map(([_, v]) => v));
            q.__extras = q.extras ? shuffle(q.extras) : [];
          }
          if (q.type === "drag_groups") {
            q.__items = shuffle(q.items);
            q.__groupNames = Object.keys(q.groups);
          }
        });
        render();
        window.scrollTo({ top: 0, behavior: "smooth" });
      }

      function render() {
        const list = document.getElementById("list");
        list.innerHTML = "";
        document.getElementById("meta").textContent = `${WORK.length} câu`;
        WORK.forEach((q, qi) => {
          const card = el("div", { class: "card", id: `q_${qi}` });
          const head = el("div", { class: "qhead" });
          head.append(el("div", { class: "qidx" }, String(qi + 1)));
          const title = el("div", { class: "qtitle" }, q.title);
          if (q.type === "multi")
            title.append(el("div", { class: "hint" }, "(Chọn nhiều)"));
          if (q.type === "tfset")
            title.append(el("div", { class: "hint" }, "(Đúng / Sai)"));
          if (q.type && q.type.includes("drag"))
            title.append(el("div", { class: "hint" }, "(Kéo thả)"));
          head.append(title);
          card.append(head);
          const body = el("div", { class: "answers" });

          if (q.type === "single" || q.type === "multi") {
            q.options.forEach((opt) => {
              const id = `q${qi}_${safeId(opt)}`;
              const lab = el("label");
              const ipt = el("input", {
                type: q.type === "single" ? "radio" : "checkbox",
                name: `q${qi}`,
                value: opt,
                id,
              });
              lab.append(ipt, el("span", {}, opt));
              body.append(lab);
            });
          }
          if (q.type === "tfset") {
            q.statements.forEach((st, si) => {
              const row = el("div", { class: "tf-item" });
              row.append(el("div", {}, st.text));
              const ch = el("div", { class: "tf-row" });
              ["Đúng", "Sai"].forEach((v) => {
                const lab = el("label");
                const ipt = el("input", {
                  type: "radio",
                  name: `q${qi}_s${si}`,
                  value: v,
                });
                lab.append(ipt, el("span", {}, v));
                ch.append(lab);
              });
              row.append(ch);
              body.append(row);
            });
          }
          if (q.type === "drag_pairs") {
            const wrap = el("div", { class: "dragwrap" });
            const zones = el("div", { class: "dragzone" });
            q.__right.forEach((r) => {
              const z = el("div", { class: "zone", dataset: { target: r } });
              z.append(el("h4", {}, r), el("div", { class: "droparea" }));
              zones.append(z);
            });
            wrap.append(zones);
            const pool = el("div", { class: "pool" });
            [...q.__left, ...(q.__extras || [])].forEach((l) => {
              pool.append(
                el(
                  "div",
                  { class: "pill", draggable: true, dataset: { txt: l } },
                  l,
                ),
              );
            });
            wrap.append(pool);
            body.append(wrap);
          }
          if (q.type === "drag_groups") {
            const wrap = el("div", { class: "dragwrap" });
            const zones = el("div", { class: "dragzone" });
            q.__groupNames.forEach((g) => {
              const z = el("div", { class: "zone", dataset: { gname: g } });
              z.append(el("h4", {}, g), el("div", { class: "droparea" }));
              zones.append(z);
            });
            wrap.append(zones);
            const pool = el("div", { class: "pool" });
            q.__items.forEach((item) => {
              pool.append(
                el(
                  "div",
                  { class: "pill", draggable: true, dataset: { txt: item } },
                  item,
                ),
              );
            });
            wrap.append(pool);
            body.append(wrap);
          }
          card.append(body, el("div", { class: "result", id: `res_${qi}` }));
          list.append(card);
        });
        enableDragDrop();
      }

      function enableDragDrop() {
        document.querySelectorAll(".pill").forEach((p) => {
          p.addEventListener("dragstart", (e) => {
            e.dataTransfer.setData("text/plain", p.dataset.txt);
          });
        });
        document.querySelectorAll(".droparea,.pool").forEach((area) => {
          area.addEventListener("dragover", (e) => e.preventDefault());
          area.addEventListener("drop", (e) => {
            e.preventDefault();
            const txt = e.dataTransfer.getData("text/plain");
            if (!txt) return;
            const old = document.querySelector(
              `.pill[data-txt="${CSS.escape(txt)}"]`,
            );
            if (old) old.remove();
            const pill = el(
              "div",
              { class: "pill", draggable: true, dataset: { txt } },
              txt,
            );
            pill.addEventListener("dragstart", (ev) =>
              ev.dataTransfer.setData("text/plain", txt),
            );
            area.append(pill);
          });
        });
      }

      function getUserAnswer(q, qi) {
        if (q.type === "single" || q.type === "multi") {
          return Array.from(
            document.querySelectorAll(`#q_${qi} input:checked`),
          ).map((x) => x.value);
        }
        if (q.type === "tfset") {
          return q.statements.map((st, si) => {
            const inp = document.querySelector(
              `input[name="q${qi}_s${si}"]:checked`,
            );
            return inp ? inp.value === "Đúng" : null;
          });
        }
        if (q.type === "drag_pairs") {
          const ans = {};
          document.querySelectorAll(`#q_${qi} .zone`).forEach((z) => {
            const target = z.dataset.target;
            const pill = z.querySelector(".pill");
            if (pill) ans[pill.dataset.txt] = target;
          });
          return ans;
        }
        if (q.type === "drag_groups") {
          const ans = {};
          document.querySelectorAll(`#q_${qi} .zone`).forEach((z) => {
            const gname = z.dataset.gname;
            ans[gname] = Array.from(z.querySelectorAll(".pill")).map(
              (p) => p.dataset.txt,
            );
          });
          return ans;
        }
        return null;
      }

      function isCorrect(q, ans) {
        if (q.type === "single" || q.type === "multi") {
          return (
            ans.length === q.answer.length &&
            ans.every((a) => q.answer.includes(a))
          );
        }
        if (q.type === "tfset") {
          return ans.every((a, i) => a === q.statements[i].answer);
        }
        if (q.type === "drag_pairs") {
          return Object.entries(q.pairs).every(([l, r]) => ans[l] === r);
        }
        if (q.type === "drag_groups") {
          return Object.entries(q.groups).every(([g, arr]) =>
            arr.every((item) => ans[g] && ans[g].includes(item)),
          );
        }
        return false;
      }

      function showKey(q, qi) {
        const res = document.getElementById(`res_${qi}`);
        res.innerHTML = "";
        if (q.type === "single" || q.type === "multi")
          res.innerHTML = `<div class="hint">Đáp án: <b>${q.answer.join(
            ", ",
          )}</b></div>`;
        if (q.type === "tfset")
          res.innerHTML = `<div class="hint">Đáp án: <b>${q.statements
            .map((s) => (s.answer ? "Đúng" : "Sai"))
            .join(" · ")}</b></div>`;
        if (q.type === "drag_pairs")
          res.innerHTML = `<div class="hint">Đáp án:<br><b>${Object.entries(
            q.pairs,
          )
            .map(([l, r]) => `${l} → ${r}`)
            .join("<br>")}</b></div>`;
        if (q.type === "drag_groups")
          res.innerHTML = `<div class="hint">Đáp án:<br><b>${Object.entries(
            q.groups,
          )
            .map(([g, a]) => `${g}: ${a.join(", ")}`)
            .join("<br>")}</b></div>`;
      }

      function checkAll() {
        let correct = 0;
        WORK.forEach((q, qi) => {
          const res = document.getElementById(`res_${qi}`);
          const user = getUserAnswer(q, qi);
          if (isCorrect(q, user)) {
            correct++;
            res.textContent = "✔ Đúng";
            res.className = "result r-good";
          } else {
            res.textContent = "✘ Sai";
            res.className = "result r-bad";
          }
        });
        document.getElementById("meta").textContent =
          `${correct}/${WORK.length} đúng`;
      }

      document.getElementById("btnCheck").addEventListener("click", checkAll);
      document
        .getElementById("btnReset")
        .addEventListener("click", () => reset(true));
      let keyVisible = false;
      document.getElementById("btnToggleKey").addEventListener("click", () => {
        keyVisible = !keyVisible;
        WORK.forEach((q, qi) => {
          if (keyVisible) showKey(q, qi);
          else {
            const r = document.getElementById(`res_${qi}`);
            r.textContent = "";
            r.className = "result";
          }
        });
      });

      reset(true);
    </script>
  </body>
</html>
